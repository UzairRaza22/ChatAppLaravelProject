services:
  # Laravel Application Container
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: whistle-it-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./storage/app/public:/var/www/html/storage/app/public
    environment:
      - APP_NAME=Whistle-It
      - APP_ENV=local
      - APP_KEY=base64:ICfCGjqu7SIsx3rJNECI7gUOOILx8FB16cdBapUZFRM=
      - APP_DEBUG=true
      - APP_URL=http://localhost:8000
      - DB_CONNECTION=mongodb
      - MONGO_HOST=mongodb
      - MONGO_PORT=27017
      - MONGO_DATABASE=whistle_it
      - MONGO_USERNAME=whistle_user
      - MONGO_PASSWORD=whistle_password
      - MONGO_AUTH_SOURCE=admin
      - MONGO_AUTH_DATABASE=admin
      - GRIDFS_CONNECTION=mongodb
      - GRIDFS_DATABASE=whistle_it
      - CACHE_DRIVER=file
      - FILESYSTEM_DISK=local
      - QUEUE_CONNECTION=sync
      - SESSION_DRIVER=file
      - SESSION_LIFETIME=120
      - MAIL_MAILER=smtp
      - MAIL_HOST=mailhog
      - MAIL_PORT=1025
      - MAIL_USERNAME=null
      - MAIL_PASSWORD=null
      - MAIL_ENCRYPTION=null
      - MAIL_FROM_ADDRESS=noreply@whistle-it.com
      - MAIL_FROM_NAME="${APP_NAME}"
      - LOG_CHANNEL=stack
      - LOG_DEPRECATIONS_CHANNEL=null
      - LOG_LEVEL=debug
    depends_on:
      - mongodb
      - mailhog
    networks:
      - whistle-it-network

  # NGINX Web Server
  nginx:
    image: nginx:alpine
    container_name: whistle-it-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - nginx_logs:/var/log/nginx
    depends_on:
      - app
    networks:
      - whistle-it-network

  # MongoDB Database
  mongodb:
    image: mongo:6.0
    container_name: whistle-it-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=whistle_it
    volumes:
      - mongodb_data:/data/db
      - ./docker/mongodb/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    networks:
      - whistle-it-network

  # Mailhog for Email Testing
  mailhog:
    image: mailhog/mailhog:latest
    container_name: whistle-it-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"  # SMTP port
      - "8025:8025"  # Web UI port
    networks:
      - whistle-it-network

networks:
  whistle-it-network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
  nginx_logs:
    driver: local
